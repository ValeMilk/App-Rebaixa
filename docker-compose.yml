services:
  # O servico se chama "rebaixa-backend" (e nao "backend") porque ele tambem entra na rede do BI,
  # onde outro sistema ja usa o apelido "backend". Dentro da rede do Rebaixa o apelido "backend"
  # continua valendo (e o que o nginx usa).
  rebaixa-backend:
    build: ./backend
    container_name: rebaixa-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    networks:
      rebaixa-net:
        aliases:
          - backend
      # Postgres do BI (bi_cometa_db:5432): fonte do estoque. Sem porta exposta para fora.
      bi-net: {}

  frontend:
    build:
      context: ./frontend
      args:
        # /api sera interceptado pelo Nginx e redirecionado ao backend
        NEXT_PUBLIC_API_URL: /api
    container_name: rebaixa-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - rebaixa-backend
    networks:
      - rebaixa-net

  nginx:
    image: nginx:alpine
    container_name: rebaixa-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - rebaixa-backend
    networks:
      - rebaixa-net

networks:
  rebaixa-net:
    driver: bridge
  # Rede do stack de BI (criada por ele). Precisa existir no servidor antes do deploy.
  bi-net:
    external: true
    name: docker_bi_network

