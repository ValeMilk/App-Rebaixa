upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:4000;
}

server {
    listen 80;
    server_name _;

    # Tamanho maximo de upload (para futuras funcionalidades)
    client_max_body_size 10M;

    # Cabecalhos de segurança basicos
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # API — proxy para o backend Express
    location /api/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # MCP do BI (container bi_cometa_mcp, rede do BI): Postgres somente leitura para clientes MCP.
    # Exige Bearer token (validado pelo proprio MCP). O nome e resolvido na hora do request (resolver +
    # variavel), entao o nginx continua subindo mesmo se o container do MCP nao existir.
    location = /mcp {
        resolver           127.0.0.11 valid=10s;
        set                $mcp_upstream http://bi-cometa-mcp:8001;
        proxy_pass         $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_read_timeout 90s;       # abaixo dos ~100s em que o Cloudflare corta a conexao (erro 524)
        client_max_body_size 1m;
    }

    # Tudo mais — proxy para o frontend Next.js
    location / {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
